{% extends 'base.html' %}

{% block content %}
<style>
    body { background-color: #fcfcfc; }
    
    /* 🚀 Widescreen Desktop View */
    .chat-container {
        width: 95%; 
        max-width: 1200px; 
        margin: 40px auto;
        height: 82vh; 
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 30px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .chat-header {
        padding: 20px 30px;
        background: white;
        border-bottom: 1px solid #edf2f7;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .ai-avatar {
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, #2ecc71, #78ffd6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.2rem;
    }

    .chat-box {
        flex: 1;
        padding: 30px 40px; 
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Message Bubbles */
    .message {
        max-width: 65%; 
        padding: 15px 20px;
        border-radius: 20px;
        font-size: 1rem;
        line-height: 1.6;
        animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .msg-user {
        background: #1a202c;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .msg-ai {
        background: #f0fdf4;
        color: #1a202c;
        border: 1px solid #dcfce7;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    /* Product Recommendation Cards inside Chat */
    .product-rec {
        display: flex;
        align-items: center;
        gap: 15px;
        background: white;
        border: 1px solid #e2e8f0;
        padding: 12px 20px;
        border-radius: 12px;
        margin-top: 5px;
        text-decoration: none;
        color: inherit;
        transition: 0.2s;
        max-width: 400px; 
    }
    .product-rec:hover { border-color: #2ecc71; transform: translateY(-2px); }

    /* Input Area */
    .chat-input-area {
        padding: 20px 40px;
        background: white;
        border-top: 1px solid #edf2f7;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .chat-input {
        width: 100%;
        padding: 18px 65px 18px 30px;
        border: 1px solid #e2e8f0;
        border-radius: 50px;
        outline: none;
        font-size: 1.05rem;
        transition: 0.3s;
    }
    .chat-input:focus { border-color: #2ecc71; box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1); }

    .send-btn {
        position: absolute;
        right: 12px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #1a202c;
        color: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.3s;
    }
    .send-btn:hover { background: #2ecc71; transform: scale(1.05); }

    /* Typing Indicator */
    .typing-dots { display: none; align-self: flex-start; background: #f1f5f9; padding: 12px 20px; border-radius: 20px; border-bottom-left-radius: 4px; }
    .dot { width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; display: inline-block; animation: typing 1.4s infinite ease-in-out both; margin: 0 2px; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Mobile Responsive Rules */
    @media (max-width: 768px) {
        .chat-container { width: 100%; margin: 10px auto; height: calc(100vh - 120px); border-radius: 20px; border: none; }
        .chat-header { padding: 15px 20px; }
        .chat-box { padding: 20px 15px; }
        .message { max-width: 90%; font-size: 0.95rem; padding: 12px 16px; }
        .chat-input-area { padding: 15px; }
        .chat-input { font-size: 1rem; padding: 14px 55px 14px 20px; }
    }
</style>

<div class="container">
    <div class="chat-container">
        <div class="chat-header">
            <div class="ai-avatar"><i class="fas fa-robot"></i></div>
            <div>
                <h3 class="mb-0" style="font-size: 1.2rem; font-weight: 700;">GlowGuide AI</h3>
                <small class="text-success fw-bold">● Online</small>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message msg-ai">
                Hi! I'm your intelligent skin assistant. I can help you analyze ingredients, build a routine, or target specific concerns like acne or dryness. How can I help you today?
            </div>
            
            <div class="typing-dots" id="typingIndicator">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
        </div>

        <div class="chat-input-area">
            <form id="chatForm" class="input-wrapper">
                {% csrf_token %}
                <input type="text" id="userInput" class="chat-input" placeholder="e.g., How do I get rid of dry skin?" autocomplete="off" required>
                <button type="submit" class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const typingIndicator = document.getElementById('typingIndicator');

    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // 🚀 THE PREMIUM MARKDOWN FORMATTER
    function formatChatMarkdown(text) {
        if (!text) return "";
        let html = text;
        
        // 1. Format Headers
        html = html.replace(/### (.*?)\n/g, '<div style="font-weight: 800; font-size: 1.1rem; color: #1a202c; margin-top: 15px; margin-bottom: 8px;">$1</div>');
        
        // 2. Make bold text (**text**) crisp and dark
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong style="color: #1a202c; font-weight: 800;">$1</strong>');
        
        // 3. Turn standard bullet points (* text) into gorgeous highlighted blocks!
        // We use (?:^|\n) to catch bullets safely even at the start of a line
        html = html.replace(/(?:^|\n)\*\s+(.*)/g, '<br><div style="margin-left: 10px; border-left: 3px solid #2ecc71; padding-left: 12px; margin-top: 6px; margin-bottom: 6px; background: rgba(46, 204, 113, 0.05); border-radius: 0 8px 8px 0; padding-top: 8px; padding-bottom: 8px; line-height: 1.5;">$1</div>');
        
        // 4. Handle standard line breaks
        html = html.replace(/\n/g, '<br>');
        
        // Cleanup double breaks caused by the block replacement
        html = html.replace(/<br><br><div/g, '<br><div');
        
        return html;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        // Add User Message
        const userMsg = document.createElement('div');
        userMsg.className = 'message msg-user';
        userMsg.textContent = text;
        chatBox.insertBefore(userMsg, typingIndicator);
        
        userInput.value = '';
        scrollToBottom();

        // Show Typing Indicator
        typingIndicator.style.display = 'block';
        scrollToBottom();

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ message: text })
            });

            typingIndicator.style.display = 'none';

            // Create blank AI bubble
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message msg-ai';
            chatBox.insertBefore(aiMsg, typingIndicator);

            // Container for products
            const productsContainer = document.createElement('div');
            productsContainer.style.display = 'flex';
            productsContainer.style.flexDirection = 'column';
            chatBox.insertBefore(productsContainer, typingIndicator);

            // 🚀 THE MAGIC: Read the Stream
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let streamBuffer = "";
            let chatText = "";
            let isMetadataParsed = false;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                streamBuffer += chunk;

                if (!isMetadataParsed && streamBuffer.includes('--CHUNK_DIVIDER--')) {
                    const parts = streamBuffer.split('--CHUNK_DIVIDER--');
                    
                    try {
                        const metaData = JSON.parse(parts[0].trim());
                        if (metaData.products && metaData.products.length > 0) {
                            metaData.products.forEach(product => {
                                const prodLink = document.createElement('a');
                                prodLink.href = `/product/${product.id}/`;
                                prodLink.className = 'product-rec';
                                
                                let imageElement = product.image_url 
                                    ? `<img src="${product.image_url}" alt="${product.name}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0;">`
                                    : `<div style="background:#f1f5f9; padding:10px; border-radius:8px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;"><i class="fas fa-pump-soap text-success"></i></div>`;

                                prodLink.innerHTML = `
                                    ${imageElement}
                                    <div>
                                        <div style="font-weight:600; font-size:0.9rem; color: #1a202c;">${product.name.substring(0, 35)}...</div>
                                        <div class="text-success" style="font-size:0.85rem; font-weight:700;">₹${product.lowest_price}</div>
                                    </div>
                                `;
                                productsContainer.appendChild(prodLink);
                            });
                        }
                    } catch(e) {}
                    
                    isMetadataParsed = true;
                    // Start accumulating the actual text
                    chatText = parts[1] ? parts[1].replace(/^\n+/, '') : "";
                } else if (isMetadataParsed) {
                    chatText += chunk;
                }
                
                // 🚀 Send the raw stream through our new markdown formatter
                aiMsg.innerHTML = formatChatMarkdown(chatText);
                scrollToBottom();
            }

        } catch (error) {
            console.error("Chat Stream Error:", error);
            typingIndicator.style.display = 'none';
            const errorMsg = document.createElement('div');
            errorMsg.className = 'message msg-ai';
            errorMsg.textContent = "Oops! My connection dropped 🧘‍♀️ Let's try that again!";
            chatBox.insertBefore(errorMsg, typingIndicator);
            scrollToBottom();
        }
    });
</script>
{% endblock %}
