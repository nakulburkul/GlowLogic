{% extends 'base.html' %}
{% block content %}
<style>
    .auth-form input { width: 100%; padding: 12px 15px; margin-top: 5px; border: 1px solid #ced4da; border-radius: 8px; background-color: #f8f9fa; }
    .auth-form input:focus { outline: none; border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2); }
    .auth-form label { font-weight: bold; font-size: 0.85rem; color: #6c757d; margin-top: 15px; display: block; text-align: left; }
    .auth-form .helptext { font-size: 0.8rem; color: #adb5bd; display: block; text-align: left; margin-top: 5px; }
    .auth-form ul { list-style: none; padding: 0; margin: 5px 0 0 0; text-align: left; }
    .auth-form ul.errorlist li { color: #e74c3c; font-size: 0.85rem; font-weight: bold; }
</style>

<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 text-center" style="width: 450px;">
        <h2 class="fw-bold mb-2" style="font-family: 'Playfair Display', serif;">Welcome Back</h2>
        <p class="text-muted mb-4">Log in to your GlowGuide account.</p>
        
        <form method="POST" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-glow w-100 py-3 mt-4 fs-5">Log In</button>
        </form>
        
        <p class="text-center mt-4 small"><a href="/signup/" class="text-muted fw-bold">Need an account? Sign up.</a></p>
    </div>
</div>
{% endblock %}
